<html>

<head>
  <style>
    table,
    tr,
    td {
      border: solid;
    }
  </style>
</head>

<body>
  <script>
    function add() {
      var table = document.getElementById("table")
      var row = table.insertRow()
      var cell1 = row.insertCell(0)
      var cell2 = row.insertCell(1)
      var cell3 = row.insertCell(2)

      cell1.innerHTML = "10001"
      cell2.innerHTML = "amit kumar"
      cell3.innerHTML = "20000"
    }
  </script>
<div style="margin-left:300pt;background-color:wheat;padding:40pt;width: 20%;">
  <table id="table">
    <tr>
      <th>id</th>
      <th>name</th>
      <th>salary</th>
    </tr>
  </table>
  <button type="button" onClick="add()">add</button>
</div>
</body>
</html>
