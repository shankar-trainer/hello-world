<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script>
 function validate(){
	 var id=document.getElementById('id').value;
	 var name=document.getElementById('name').value;
	 
	 if(id==""){
		 alert("id is blank")
		 return false
	 }
	 
	 else if(name==""){
		 alert("name is blank")
		 return false
	 }
	 else{
		 return true
	 }
	 
 }
</script>
</head>
<body>

	<form action="PersonAction" onsubmit="return validate()" method="post">
		<div>
			<label>enter id </label> <input name="id" id="id">
		</div>
		
		<div>
			<label>enter name </label> <input name="name" id="name">
		</div>
		
		
		<div>
			<label>enter password </label> <input name="password" id="password" type="password">
		</div>
		
		<div>
			<button type="submit">send</button>
			<button type='reset'>cancel</button>
		</div>
		
	</form>



</body>
</html>
