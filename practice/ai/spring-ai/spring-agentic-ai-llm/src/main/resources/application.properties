spring.application.name=spring-agentic-ai-llm

# Ollama Cloud's OpenAI-compatible API. This calls ollama.com directly.
spring.ai.openai.base-url=https://ollama.com
spring.ai.openai.api-key=${OLLAMA_API_KEY}
spring.ai.openai.chat.options.model=${OLLAMA_MODEL:gpt-oss:120b}
spring.ai.openai.chat.options.temperature=0.2
