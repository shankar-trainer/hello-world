<div class="container">
    <div class="row">
        <div class="panel-heading">Student List</div>
        <table class="table table-bordered table-stripped">
            <thead>
                <th>Id</th>
                <th>RollNo</th>
                <th>Name</th>
                <th>Email</th>
                <th>College</th>
                <th>Branch</th>
            </thead>
            <tbody>
                <tr *ngFor="let student of students;index as i">
                    <td>{{student.id}}</td>
                    <td>{{student.rollNo}}</td>
                    <td>{{student.name}}</td>
                    <td>{{student.email}}</td>
                    <td>{{student.college}}</td>
                    <td>{{student.branch}}</td>
                    <td>
                        
                            <tr>
                                <th>Id</th>
                                <th>Book Name</th>
                                <th>Price</th>
                            </tr>

                            <tr *ngFor="let b of student.books">
                                <td>{{b.id}}</td>
                                <td>{{b.bookName}}</td>
                                <td>{{b.price}}</td>
                            </tr>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
