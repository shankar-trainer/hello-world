<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>User Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6f8;
        }

        .profile-card {
            background: white;
            padding: 40px;
            width: 450px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 3px solid #4285F4;
        }

        h2 {
            color: #333;
            margin-bottom: 25px;
        }

        .info {
            margin: 15px 0;
            color: #555;
            font-size: 16px;
        }

        .label {
            font-weight: bold;
            color: #222;
        }

        .logout-btn {
            margin-top: 25px;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            background: #dc3545;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
        }

        .logout-btn:hover {
            background: #c82333;
        }
    </style>
</head>

<body>

<div class="profile-card">

    <h2>User Profile</h2>

    <img class="avatar"
         th:src="${picture}"
         alt="Profile Picture">

    <div class="info">
        <span class="label">Name:</span>
        <span th:text="${name}"></span>
    </div>

    <div class="info">
        <span class="label">Email:</span>
        <span th:text="${email}"></span>
    </div>

    <form th:action="@{/logout}" method="post">
        <button class="logout-btn" type="submit">
            Sign Out
        </button>
    </form>

</div>

</body>
</html>
