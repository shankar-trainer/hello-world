<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <script>
     function addition(a,b){  //es 5 
        return a+b;
     }

     // arrow function 
     addition1=(a,b)=>a+b; // es6 

     console.log(addition1(11,12))

     // map function 
     ar1=[1,2,3,4]
     console.log(ar1)

     let ar2=ar1.map(function(a){
       return a*a;
     })
     console.log(ar2)

     var ar3=ar1.map(a=>a*a)
     console.log(ar3)
    
     ar3=ar1.filter(function(a){
        return a%2==0
     })
    
     ar4=ar1.filter((a)=> a%2==0)

    console.log(ar1+ "  using filter for even no  "+ar3+"\n"+ar4)

    </script>
    
</body>
