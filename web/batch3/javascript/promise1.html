<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
</head>

<body>
    <script>
        var x = 11;
        var promise = new Promise((resolve, reject) => {
            if (x % 2 == 0)
                resolve("it is even number")
            else
                reject("odd number")
        });
        promise.then((result) => {
            alert(result)
        }).catch((e) => {
            alert(e)
        })
    </script>

</body>

</html>
