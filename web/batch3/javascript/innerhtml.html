<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <style>
        .hello {
            border: solid 2pt;
            padding: 20pt;
            float: left;
            width: 40%;
            margin-right: 10pt;
            background-color: aqua;
        }
    </style>
</head>
<body>
    <script>
        function changeIt() {
            var a = document.getElementById('id1').innerHTML;
            alert(a)
            // document.getElementById('id1').innerHTML = "<h2>we will learn react also</h2>"
            document.getElementById('id1').innerText = "<h2>we will learn react also</h2>"
        }
        var x=1;
        function increment(){
               document.getElementById('id2').innerHTML='Count is  '+x++  
        }
        function decrement(){
               document.getElementById('id2').innerHTML='Count is  '+x--  
        }
    </script>
    <div class="hello" id="id2" onclick="increment()">
        Count is 1
    </div>

    <div class="hello" id="id1">
        we are learning javascript
    </div>
    
    <div class="hello" style="background-color: bisque;margin-top: 20pt;">
    
     <button type="button" onclick="changeIt()"> changeIt </button>
     <button type="button" onclick="increment()"> increment </button>
     <button type="button" onclick="decrement()">decrement </button>
    </div>

</body>

</html>
