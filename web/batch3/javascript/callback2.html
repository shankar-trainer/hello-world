<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
</head>
<style>
    .col{
        float: left;
        width: 43%;
    }
</style>
<body onload="myclock(), mydate()">
    <div id="clock" class="col">
    </div>
    
    <div id="time" class="col">
    </div>
    <script>
        myclock=()=>{
                setInterval(() => {
                document.getElementById("clock").innerHTML=new Date().toLocaleTimeString()
                }, 1000);
        }
        mydate=()=>{
                setInterval(() => {
                document.getElementById("time").innerHTML=new Date().toDateString()
                }, 1000);
        }

        alert("alarm will ring after 5 second ")
        setTimeout(() => {
            alert("alarm is ringing ")
        }, 5000);

        setInterval(() => {
            console.log("time is "+new Date().toLocaleTimeString())
        }, 1000);

    </script>
</body>
</html>
