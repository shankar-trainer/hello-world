<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <style>
        .col1{
            float: left;
            width: 10%;
            border:solid;
            padding: 20pt;
            margin-right: 20pt;
            height: 50pt;
        }
        .col2{
            float: left;
            width: 30%;
            border:solid;
            padding: 20pt;
            margin-right: 20pt;
            height: 50pt;
        }

    </style>
</head>
<body>

    <div id="apple" class="col1" onmouseover="apple_description()">
           apple
    </div>
    
    <div id="apple_desc" class="col2">
    </div>
    <script>
     apple_description=()=>{
        xmlreq=new XMLHttpRequest();
        xmlreq.onreadystatechange=()=>{
             if(xmlreq.readyState==4 && xmlreq.status==200)
            {
               document.getElementById('apple_desc').innerHTML=xmlreq.responseText
            }
        };
        xmlreq.open("get","apple.txt",true);
        xmlreq.send()
     }

    </script>


    
</body>
</html>
