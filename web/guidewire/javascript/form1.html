<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function addition(){
            var no1=document.getElementById('n1').value
            var no2=document.getElementById('n2').value
            if(no1=='')
              alert("no1 is blank")
            
            else if(no2=='')
              alert("no2 is blank")
            else{
            no1=parseFloat(no1);
            no2=parseFloat(no2);
            alert(`sum of ${no1} and ${no2} is ${no1+no2}`)
            }
        }
    </script>
</head>
<body>
    <form>
        <div>
            <label>enter number1</label>
            <input id="n1">
        </div>
        <div>
            <label>enter number1</label>
            <input id="n2">
        </div>

        <button type="button" onclick="addition()">sum</button>
    </form>
</body>

</html>
