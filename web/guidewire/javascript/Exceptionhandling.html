<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a = 10;
        //    var b=2;
        var b = 0;
        try {
            if(b==0)
             throw new Error('second number is zero');
            document.write(`division of ${a}, ${b} is `, a / b);
        }
        catch (error) {
            document.write(error.name+' error is ' + error.message);
        }
        finally{
            console.log('cleaning resources ')
        }
    </script>

</body>

</html>
