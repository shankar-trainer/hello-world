<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // assigning two array using spread operator 

        var ar1 = [1, 2, 3, 4];
        var ar2 = [5, 6, 7, 8];
        var ar3 = [...ar1, ...ar2];
        var ar4 = [...ar2, ...ar1];

        var ar5 = [777, ...ar2, ...ar1, 999];

        console.log(ar3);
        console.log(ar4);
        console.log(ar5);

        const user1 = {
            "name": "amit kumar",
            "age": 30
        }
        const user1_academic = {
            "10th": 2015,
            "12th": 2017,
            "b.tech": 2021,
        }

        const user1_profile = { ...user1, ...user1_academic }
        console.log(user1_profile)
        user1_profile.name = 'sandeep kumar'
        console.log(user1_profile)
        console.log(user1)

    </script>
</body>

</html>
