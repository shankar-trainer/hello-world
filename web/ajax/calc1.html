<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url("css/bootstrap.min.css");
    </style>
    <script src="script/jquery-3.7.1.min.js">
    </script>
    <script>
        $(function () {
            $("#addition").click(function () {
                var a = $("#n1").val()
                var b = $("#n2").val()
                if (a == "")
                    //alert("no1 is blank")
                    $("#n1_err").html("no1 is blank")
                else if (isNaN(a))
                    // alert("no1 is not a number ")
                    $("#n1_err").html("no1 is not a number")
                else if (b == "")
                    // alert("no2 is blank")
                    $("#n2_err").html("no2 is blank")
                else if (isNaN(b))
                    // alert("no2 is not a number ")
                    $("#n2_err").html("no2 is not a number ").css("color","red")
                else {
                    var c = parseFloat(a) + parseFloat(b)
                    // alert("sum is " + c)
                    $("#result").html("sum is "+c)
                }
            })
        })
    </script>
</head>

<body>
<div class="container bg-warning text-dark p-5 m-5 w-75" style="border-radius: 20pt;border:double 10pt grey">

    <div class="form-group">
        <label>enter no1</label>
        <input class="form-control" id="n1">
        <span id="n1_err"></span>
    </div>

    <div class="form-group mt-2">
        <label>enter no2</label>
        <input class="form-control" id="n2">
        <span id="n2_err"></span>
    </div>
    <div class="form-group mt-2">
        <label>Result </label>
        <label id="result"></label>
    </div>
    <div class="form-group mt-2">
        <button class="btn btn-secondary" id="addition">addition</button>
        <button class="btn btn-secondary" id="subtraction">subtraction</button>
        <button class="btn btn-secondary" id="multiplication">multiplication</button>
        <button class="btn btn-secondary" id="division">division</button>
    </div>
</div>
</body>

</html>
