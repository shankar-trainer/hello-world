<!DOCTYPE html>
<html>

<head>
    <title>Todo List Table</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: sans-serif;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #f4f4f4;
        }

        tr:nth-child(even) {
            background-color: #fafafa;
        }
    </style>
</head>

<body>

    <h2>My Todo List</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Task Title</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="todo-table-body">
        </tbody>
    </table>

    <script>

        var hello = async () => {
            // 1. Fetch the data
            var response = await fetch("https://jsonplaceholder.typicode.com/todos");
            var data = await response.json();

            // 2. Select the table body where we want to put the data
            const tableBody = document.querySelector("#todo-table-body");

            // 3. Convert the array of objects into an array of HTML strings
            const htmlRows = data.map(todo => {
                return `
      <tr>
        <td>${todo.id}</td>
        <td>${todo.title}</td>
        <td>${todo.completed ? "✅ Done" : "⏳ Pending"}</td>
      </tr>
    `;
            });

            // 4. Join all the strings together and inject them into the table
            tableBody.innerHTML = htmlRows.join("");
        }

        hello();

    </script>
</body>

</html>
