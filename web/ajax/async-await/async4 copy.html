<!DOCTYPE html>
<html>

<head>
    <title>Todo List Table</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: sans-serif;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #f4f4f4;
        }

        tr:nth-child(even) {
            background-color: #fafafa;
        }
    </style>
</head>

<body>
    <script>
        var hello = async () => {
            var response = await fetch("https://jsonplaceholder.typicode.com/todos");
            var data = await response.json();

            document.writeln(`<table><tr><th>
                <th>ID</th>
                <th>Task Title</th>
                <th>Status</th>
            </tr>`)
            var body1 = data.map(todo => {
                return `<tr>
                    <td>${todo.id}</td>
                    <td>${todo.title}</td>
                    <td>${todo.completed ? "✅ Done" : "⏳ Pending"}</td>
                </tr>`
            })
            document.writeln(body1)
            document.writeln('</table>')
        }
        hello();
    </script>
</body>
</html>
