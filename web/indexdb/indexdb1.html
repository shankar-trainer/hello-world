<script>
//1. Initializing and Opening the Database

let db;
const request = indexedDB.open("StoreDatabase", 1);

request.onupgradeneeded = (event) => {
  db = event.target.result;
  // Create an object store named 'products' with 'id' as the primary key
  const store = db.createObjectStore("products", { keyPath: "id", autoIncrement: true });
  // Create an index to search products by name
  store.createIndex("nameIndex", "name", { unique: false });
};

request.onsuccess = (event) => {
  db = event.target.result;
  console.log("Database opened successfully");

  addProduct('book1',1200);
  addProduct('book2',1300);     
  addProduct('book3',1400);
  fetchAllProducts();
  //getProduct(1);
};

request.onerror = (event) => {
  console.error("Database error:", event.target.errorCode);
};

// 2. Adding and Retrieving Data
// Function to add a product

function addProduct(name, price) {
  const transaction = db.transaction(["products"], "readwrite");
  const store = transaction.objectStore("products");
  
  const request = store.add({ name, price });
  
  request.onsuccess = () => console.log("Product added!");
  transaction.oncomplete = () => console.log("Transaction finished.");
}

function fetchAllProducts() {
  const transaction = db.transaction(["products"], "readonly");
  const store = transaction.objectStore("products");
  
  // Returns all objects in the object store
  const request = store.getAll();

  request.onsuccess = () => {
    const prd = request.result;
    console.log("Retrieved all products : ", prd);
  };

  request.onerror = () => {
    console.error("Failed to fetch users:", request.error);
  };
}





// Function to get a product by ID
function getProduct(id) {
  const transaction = db.transaction(["products"], "readonly");
  const store = transaction.objectStore("products");
  
  const request = store.get(id);
  
  request.onsuccess = () => {
    console.log("Found product:", request.result);
  };
}
// Update a record 3. Updating and Deleting DataThe put() method updates a record if the key already exists; //otherwise, it inserts a new one.

function updateProduct(id, newName) {
  const transaction = db.transaction(["products"], "readwrite");
  const store = transaction.objectStore("products");
  
  const request = store.put({ id, name: newName });
  request.onsuccess = () => console.log("Product updated");
}

// Delete a record
function deleteProduct(id) {
  const transaction = db.transaction(["products"], "readwrite");
  const store = transaction.objectStore("products");
  
  const request = store.delete(id);
  request.onsuccess = () => console.log("Product deleted");
}


</script>
