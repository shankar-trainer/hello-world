<body>
<script>
let db;
const request = indexedDB.open("MyDatabase", 1);

request.onupgradeneeded = (event) => {
  db = event.target.result;
  // Create an object store named "users" with an auto-incrementing primary key
  if (!db.objectStoreNames.contains("users")) {
    db.createObjectStore("users", { keyPath: "id", autoIncrement: true });
  }
};

request.onsuccess = (event) => {
  db = event.target.result;
  console.log("Database opened successfully");
  
  addUser('ram','ram@gmail.com');
  addUser('shyam','shyam@gmail.com');
  addUser('amit','amit@gmail.com');
  addUser('sumit','sumitgmail.com');
  fetchAllUsers();
};


function addUser(name, email) {
  const transaction = db.transaction(["users"], "readwrite");
  const store = transaction.objectStore("users");
  
  const user = { name, email, created: new Date() };
  const request = store.add(user);

  request.onsuccess = () => {
    console.log("User added to the store:", request.result);
  };

  request.onerror = () => {
    console.error("Error adding user:", request.error);
  };
}


function fetchAllUsers() {
  const transaction = db.transaction(["users"], "readonly");
  const store = transaction.objectStore("users");
  
  // Returns all objects in the object store
  const request = store.getAll();

  request.onsuccess = () => {
    const users = request.result;
    console.log("Retrieved all users:", users);
  };

  request.onerror = () => {
    console.error("Failed to fetch users:", request.error);
  };
}

</script>
