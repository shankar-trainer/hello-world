name: Spring Boot CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code (using latest compatible major syntax)
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Java Development Kit (JDK 17 or 21) - using setup-java v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17' # Change to '21' if your project uses Java 21
          cache: 'maven'

      # 3. Grant execution permissions to the Maven wrapper
      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      # 4. Build and run tests 
      # (If tests are failing and causing exit code 1, change to: ./mvnw clean package -DskipTests)
      - name: Build with Maven
        run: ./mvnw clean verify

      # 5. Upload build artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-app-jar
          path: target/*.jar